<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 330" width="260" height="260" class="w-full h-auto max-w-[240px] mx-auto shadow-xs rounded-2xl border border-slate-200">
    <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
    <!-- Top-Left Finder Pattern -->
    <rect x="20" y="20" width="70" height="70" fill="#1e293b" rx="6"/>
    <rect x="30" y="30" width="50" height="50" fill="#ffffff" rx="3"/>
    <rect x="40" y="40" width="30" height="30" fill="#1e293b" rx="2"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="240" y="20" width="70" height="70" fill="#1e293b" rx="6"/>
    <rect x="250" y="30" width="50" height="50" fill="#ffffff" rx="3"/>
    <rect x="260" y="40" width="30" height="30" fill="#1e293b" rx="2"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="20" y="240" width="70" height="70" fill="#1e293b" rx="6"/>
    <rect x="30" y="250" width="50" height="50" fill="#ffffff" rx="3"/>
    <rect x="40" y="260" width="30" height="30" fill="#1e293b" rx="2"/>

    <!-- Alignment Pattern -->
    <rect x="220" y="220" width="50" height="50" fill="#1e293b" rx="4"/>
    <rect x="230" y="230" width="30" height="30" fill="#ffffff" rx="2"/>
    <rect x="240" y="240" width="10" height="10" fill="#1e293b"/>

    <!-- Timing Patterns -->
    <g fill="#1e293b">
        <rect x="100" y="50" width="10" height="10"/>
        <rect x="120" y="50" width="10" height="10"/>
        <rect x="140" y="50" width="10" height="10"/>
        <rect x="160" y="50" width="10" height="10"/>
        <rect x="180" y="50" width="10" height="10"/>
        <rect x="200" y="50" width="10" height="10"/>
        <rect x="220" y="50" width="10" height="10"/>

        <rect x="50" y="100" width="10" height="10"/>
        <rect x="50" y="120" width="10" height="10"/>
        <rect x="50" y="140" width="10" height="10"/>
        <rect x="50" y="160" width="10" height="10"/>
        <rect x="50" y="180" width="10" height="10"/>
        <rect x="50" y="200" width="10" height="10"/>
        <rect x="50" y="220" width="10" height="10"/>

        <!-- Data Modules Grid Simulation -->
        <rect x="100" y="20" width="10" height="10"/>
        <rect x="110" y="30" width="10" height="10"/>
        <rect x="130" y="20" width="10" height="10"/>
        <rect x="140" y="30" width="10" height="10"/>
        <rect x="170" y="20" width="10" height="10"/>
        <rect x="190" y="30" width="10" height="10"/>
        <rect x="210" y="20" width="10" height="10"/>

        <rect x="20" y="100" width="10" height="10"/>
        <rect x="30" y="110" width="10" height="10"/>
        <rect x="70" y="100" width="10" height="10"/>
        <rect x="80" y="120" width="10" height="10"/>
        <rect x="20" y="140" width="10" height="10"/>
        <rect x="30" y="160" width="10" height="10"/>
        <rect x="70" y="170" width="10" height="10"/>
        <rect x="80" y="190" width="10" height="10"/>

        <rect x="100" y="70" width="20" height="10"/>
        <rect x="130" y="70" width="10" height="20"/>
        <rect x="150" y="80" width="20" height="10"/>
        <rect x="180" y="70" width="10" height="20"/>
        <rect x="200" y="80" width="20" height="10"/>
        <rect x="240" y="100" width="20" height="10"/>
        <rect x="270" y="110" width="10" height="20"/>
        <rect x="290" y="100" width="20" height="10"/>

        <rect x="100" y="100" width="10" height="20"/>
        <rect x="120" y="110" width="20" height="10"/>
        <rect x="110" y="130" width="20" height="10"/>
        <rect x="100" y="150" width="10" height="20"/>
        <rect x="120" y="160" width="10" height="10"/>

        <rect x="200" y="100" width="20" height="10"/>
        <rect x="210" y="120" width="10" height="20"/>
        <rect x="190" y="140" width="20" height="10"/>
        <rect x="210" y="160" width="10" height="20"/>
        <rect x="200" y="180" width="20" height="10"/>

        <rect x="100" y="200" width="20" height="10"/>
        <rect x="110" y="220" width="10" height="20"/>
        <rect x="100" y="250" width="20" height="10"/>
        <rect x="130" y="210" width="10" height="20"/>
        <rect x="140" y="240" width="20" height="10"/>
        <rect x="160" y="210" width="10" height="20"/>
        <rect x="170" y="250" width="20" height="10"/>
        <rect x="190" y="220" width="10" height="20"/>

        <rect x="280" y="140" width="20" height="10"/>
        <rect x="270" y="160" width="20" height="10"/>
        <rect x="290" y="180" width="20" height="10"/>
        <rect x="280" y="200" width="20" height="10"/>
        <rect x="290" y="240" width="20" height="10"/>
        <rect x="280" y="270" width="20" height="10"/>
        <rect x="290" y="290" width="20" height="10"/>
    </g>

    <!-- Center QRIS Badge -->
    <rect x="135" y="135" width="60" height="60" rx="10" fill="#ffffff" stroke="#234936" stroke-width="2"/>
    <rect x="140" y="140" width="50" height="50" rx="8" fill="#234936"/>
    <text x="165" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">QRIS</text>
</svg>
