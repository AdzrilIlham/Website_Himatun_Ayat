<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScholar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="mortarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="400" height="320" rx="20" fill="url(#bgScholar)"/>

  <g filter="url(#mortarShadow)">
    <!-- Stack of Books Under Cap -->
    <!-- Bottom Book (Blue) -->
    <rect x="120" y="210" width="160" height="26" rx="5" fill="#1e3a8a"/>
    <rect x="124" y="214" width="150" height="18" rx="3" fill="#2563eb"/>
    <path d="M 125 210 L 125 236 M 275 210 L 275 236" stroke="#f8fafc" stroke-width="4"/>

    <!-- Middle Book (Red) -->
    <rect x="130" y="184" width="145" height="24" rx="5" fill="#991b1b"/>
    <rect x="134" y="188" width="135" height="16" rx="3" fill="#dc2626"/>
    <path d="M 135 184 L 135 208 M 265 184 L 265 208" stroke="#f8fafc" stroke-width="4"/>

    <!-- Top Book (Emerald Green) -->
    <rect x="140" y="160" width="130" height="22" rx="5" fill="#065f46"/>
    <rect x="144" y="164" width="120" height="14" rx="3" fill="#059669"/>
    <path d="M 145 160 L 145 182 M 255 160 L 255 182" stroke="#f8fafc" stroke-width="4"/>

    <!-- Graduation Mortarboard Hat -->
    <!-- Cap Skull Base -->
    <path d="M 160 135 Q 200 150 240 135 L 235 160 Q 200 170 165 160 Z" fill="#0f172a"/>

    <!-- Diamond Board Top -->
    <polygon points="200,80 290,115 200,145 110,115" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <polygon points="200,83 285,115 200,142 115,115" fill="#334155"/>

    <!-- Gold Button on Cap -->
    <circle cx="200" cy="115" r="5" fill="#f59e0b"/>

    <!-- Gold Tassel Ribbon hanging down -->
    <path d="M 200 115 Q 240 125 255 155" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Tassel Fringe -->
    <rect x="250" y="155" width="10" height="22" rx="2" fill="#d97706"/>
    <circle cx="255" cy="155" r="4" fill="#f59e0b"/>

    <!-- Diploma Scroll on Left -->
    <rect x="95" y="195" width="22" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" transform="rotate(35 95 195)"/>
    <rect x="103" y="210" width="6" height="18" fill="#ef4444" transform="rotate(35 95 195)"/>

    <!-- Stack of Gold Coins on the Right -->
    <!-- Coin 1 -->
    <ellipse cx="280" cy="235" rx="22" ry="9" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="280" cy="233" rx="18" ry="6" fill="#fde047"/>
    <!-- Coin 2 -->
    <ellipse cx="280" cy="223" rx="22" ry="9" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="280" cy="221" rx="18" ry="6" fill="#fde047"/>
    <!-- Coin 3 -->
    <ellipse cx="280" cy="211" rx="22" ry="9" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="280" cy="209" rx="18" ry="6" fill="#fde047"/>
    <!-- Front single leaning coin -->
    <ellipse cx="255" cy="236" rx="14" ry="14" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.5"/>
    <text x="251" y="241" font-size="12" font-family="Arial, sans-serif" font-weight="bold" fill="#78350f">Rp</text>
  </g>
</svg>
