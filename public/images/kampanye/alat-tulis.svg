<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStationery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <filter id="penShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="320" rx="20" fill="url(#bgStationery)"/>

  <!-- Stack of Notebooks / Books in background -->
  <g filter="url(#penShadow)">
    <!-- Book 1 (Black/Dark spiral) -->
    <rect x="230" y="80" width="85" height="150" rx="6" fill="#1e293b"/>
    <rect x="235" y="85" width="75" height="140" rx="4" fill="#334155"/>
    <line x1="235" y1="80" x2="235" y2="230" stroke="#94a3b8" stroke-width="4" stroke-dasharray="2,6"/>

    <!-- Book 2 (Blue book) -->
    <rect x="180" y="95" width="85" height="140" rx="6" fill="#0284c7"/>
    <rect x="185" y="100" width="75" height="130" rx="4" fill="#38bdf8"/>
    <line x1="185" y1="95" x2="185" y2="235" stroke="#bae6fd" stroke-width="3"/>

    <!-- Book 3 (Purple/Violet) -->
    <rect x="210" y="110" width="85" height="130" rx="6" fill="#7c3aed"/>
    <rect x="215" y="115" width="75" height="120" rx="4" fill="#a855f7"/>

    <!-- Green Grid Notebook -->
    <rect x="250" y="125" width="75" height="120" rx="6" fill="#059669"/>
    <rect x="254" y="129" width="67" height="112" rx="4" fill="#34d399"/>
  </g>

  <!-- Pen Holder Cup with Colorful Pens & Tools -->
  <g filter="url(#penShadow)">
    <!-- Pencil / Pen tips sticking out -->
    <!-- Red ruler -->
    <rect x="115" y="60" width="16" height="130" rx="2" fill="#ef4444" transform="rotate(-15 115 60)"/>
    <line x1="120" y1="70" x2="127" y2="70" stroke="#ffffff" stroke-width="2" transform="rotate(-15 115 60)"/>
    <line x1="120" y1="85" x2="127" y2="85" stroke="#ffffff" stroke-width="2" transform="rotate(-15 115 60)"/>
    <line x1="120" y1="100" x2="127" y2="100" stroke="#ffffff" stroke-width="2" transform="rotate(-15 115 60)"/>

    <!-- Yellow pencil -->
    <rect x="135" y="70" width="10" height="110" rx="2" fill="#f59e0b" transform="rotate(-5 135 70)"/>
    <polygon points="135,70 145,70 140,55" fill="#fde68a" transform="rotate(-5 135 70)"/>
    <polygon points="138,58 142,58 140,55" fill="#1e293b" transform="rotate(-5 135 70)"/>

    <!-- Blue pen -->
    <rect x="150" y="65" width="12" height="120" rx="3" fill="#2563eb" transform="rotate(8 150 65)"/>
    <rect x="149" y="60" width="14" height="20" rx="3" fill="#1d4ed8" transform="rotate(8 150 65)"/>

    <!-- Scissors -->
    <circle cx="100" cy="80" r="12" fill="none" stroke="#ec4899" stroke-width="4"/>
    <circle cx="112" cy="72" r="12" fill="none" stroke="#ec4899" stroke-width="4"/>

    <!-- Green marker -->
    <rect x="165" y="80" width="14" height="100" rx="3" fill="#10b981" transform="rotate(18 165 80)"/>

    <!-- Main Pen Cup / Holder -->
    <rect x="110" y="145" width="75" height="95" rx="14" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
    <ellipse cx="147" cy="148" rx="36" ry="10" fill="#0369a1"/>
    <!-- Mesh pattern or shine on cup -->
    <path d="M 125 160 L 170 160 M 125 180 L 170 180 M 125 200 L 170 200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Geometry eraser / small items on the table -->
    <rect x="90" y="235" width="45" height="22" rx="4" fill="#f43f5e" transform="rotate(-10 90 235)"/>
    <rect x="110" y="231" width="23" height="22" rx="2" fill="#3b82f6" transform="rotate(-10 90 235)"/>
  </g>
</svg>
